name: secagg_scaling
seed: 0
device: auto
output_dir: demo_results
backend: torch
verbose: true
data:
  dataset: mnist
  root: ./data
  partition: iid
  alpha: 0.5
  shards_per_client: 2
  min_samples_per_client: 10
  max_train_samples: null
  max_test_samples: null
model:
  name: mlp
fl:
  num_clients: 10
  clients_per_round: 10
  rounds: 10
  upload: model
  server_lr: 1.0
client:
  local_epochs: 1
  local_steps: null
  batch_size: 32
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0
  gradient_batches: 1
aggregator:
  name: mean
pre_aggregators: []
attack: null
dp: null
secagg: null
eval:
  every: 1
  batch_size: 1000
network:
  uplink_mbps: 10.0
  downlink_mbps: 50.0
scaling:
  num_clients:
  - 5
  - 10
  - 20
  - 30
  - 40
  dim: 20000
  dropout_rate: 0.1
  protocols:
  - protocol: secagg
    reconstruction_threshold: 0.5
  - protocol: secagg+
    num_shares: 7
    reconstruction_threshold: 4
  - protocol: lightsecagg
    privacy_threshold: 0.3
    dropout_tolerance: 0.2
