name: dp_none_mnist
seed: 0
device: auto
output_dir: demo_results
backend: torch
verbose: true
data:
  dataset: mnist
  root: ./data
  partition: iid
  alpha: 0.5
  shards_per_client: 2
  min_samples_per_client: 10
  max_train_samples: null
  max_test_samples: null
model:
  name: logreg
fl:
  num_clients: 200
  clients_per_round: 50
  rounds: 40
  upload: delta
  server_lr: 1.0
client:
  local_epochs: 1
  local_steps: 10
  batch_size: 32
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
  gradient_batches: 1
aggregator:
  name: mean
pre_aggregators: []
attack: null
dp:
  mode: central
  clip: 0.5
  noise_multiplier: 0.0
  delta: 1.0e-05
secagg: null
eval:
  every: 1
  batch_size: 1000
network:
  uplink_mbps: 10.0
  downlink_mbps: 50.0
