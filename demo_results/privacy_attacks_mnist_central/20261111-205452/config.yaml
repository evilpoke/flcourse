name: privacy_attacks_mnist_central
seed: 0
device: auto
output_dir: demo_results
backend: torch
verbose: true
data:
  dataset: mnist
  root: ./data
  partition: iid
  alpha: 0.5
  shards_per_client: 2
  min_samples_per_client: 10
  max_train_samples: null
  max_test_samples: null
model:
  name: dlg_lenet
fl:
  num_clients: 10
  clients_per_round: 10
  rounds: 1
  upload: gradient
  server_lr: 1.0
client:
  local_epochs: 1
  local_steps: null
  batch_size: 1
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0
  gradient_batches: 1
aggregator:
  name: mean
pre_aggregators: []
attack: null
dp: null
secagg: null
eval:
  every: 1
  batch_size: 1000
network:
  uplink_mbps: 10.0
  downlink_mbps: 50.0
privacy:
  target_client: 0
  iterations: 30
  dp_mode: central
  dp_clip: 20.0
  dp_noise_multipliers:
  - 0.001
  - 0.01
  - 0.1
  delta: 1.0e-05
