name: byz_backdoor_clipping
seed: 0
device: auto
output_dir: demo_results
backend: torch
verbose: true
data:
  dataset: mnist
  root: ./data
  partition: iid
  alpha: 0.5
  shards_per_client: 2
  min_samples_per_client: 10
  max_train_samples: null
  max_test_samples: null
model:
  name: mlp
fl:
  num_clients: 20
  clients_per_round: 10
  rounds: 20
  upload: delta
  server_lr: 1.0
client:
  local_epochs: 1
  local_steps: 20
  batch_size: 32
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0
  gradient_batches: 1
aggregator:
  name: mean
pre_aggregators:
- name: clipping
  c: 0.5
attack:
  num_byzantine: 2
  data: backdoor
  backdoor:
    target_label: 0
    fraction: 0.5
    size: 4
  vector:
    name: scaling
    factor: 5.0
dp: null
secagg: null
eval:
  every: 1
  batch_size: 1000
network:
  uplink_mbps: 10.0
  downlink_mbps: 50.0
