name: secagg_mnist
seed: 0
device: auto
output_dir: demo_results
backend: torch
verbose: true
data:
  dataset: mnist
  root: ./data
  partition: iid
  alpha: 0.5
  shards_per_client: 2
  min_samples_per_client: 10
  max_train_samples: null
  max_test_samples: null
model:
  name: lenet5
fl:
  num_clients: 20
  clients_per_round: 10
  rounds: 15
  upload: delta
  server_lr: 1.0
client:
  local_epochs: 1
  local_steps: null
  batch_size: 32
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0
  gradient_batches: 1
aggregator:
  name: mean
pre_aggregators: []
attack: null
dp: null
secagg:
  protocol: secagg
  reconstruction_threshold: 0.5
  clipping_range: 1.0
  quantization_range: 4194304
  modulus_range: 4294967296
  dropout_rate: 0.1
  dropout_stage: masked_input
eval:
  every: 1
  batch_size: 1000
network:
  uplink_mbps: 10.0
  downlink_mbps: 50.0
