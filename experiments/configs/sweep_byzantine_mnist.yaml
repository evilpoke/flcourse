# Attacks x aggregation rules -> heatmap of the final test accuracy.
#   python experiments/sweep.py --config experiments/configs/sweep_byzantine_mnist.yaml
name: sweep_byzantine_mnist
experiment: byzantine
base_config: byz_base_mnist.yaml
metric: test_acc
overrides:
  fl: {rounds: 15}
grid:
  attack.vector:
    - null
    - {name: sign_flipping}
    - {name: ipm, tau: 5.0}
    - {name: alie, tau: 1.5}
    - {name: gaussian, sigma: 1.0}
    - {name: minmax}
  aggregator:
    - {name: mean}
    - {name: median}
    - {name: trimmed_mean}
    - {name: geometric_median}
    - {name: krum}
    - {name: multi_krum}
    - {name: centered_clipping, tau: 1.0}
