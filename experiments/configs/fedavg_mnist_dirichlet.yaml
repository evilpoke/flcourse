# Same as fedavg_mnist_iid.yaml but strongly non-IID: label proportions ~ Dirichlet(0.1).
name: fedavg_mnist_dirichlet
seed: 0
data:
  dataset: mnist
  partition: dirichlet
  alpha: 0.1                 # smaller = more heterogeneous (try 0.05 ... 100)
model:
  name: cnn
fl:
  num_clients: 20
  clients_per_round: 10
  rounds: 20
  upload: model
client:
  local_epochs: 1
  batch_size: 32
  lr: 0.05
aggregator:
  name: mean
